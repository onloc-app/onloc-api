components:
  schemas:
    UserSafe:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - username
        - admin
        - created_at
        - updated_at

    AuthTokens:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSafe"
        access_token:
          type: string
          description: JWT access token (short-lived)
        refresh_token:
          type: string
          description: JWT refresh token (long-lived)
      required:
        - user
        - access_token
        - refresh_token

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
      required:
        - access_token

    ApiKeySafe:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
          description: The full API key
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key
        - created_at
        - updated_at

    DeviceSafe:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        can_ring:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - name
        - can_ring
        - created_at
        - updated_at

    LocationSafe:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
          nullable: true
        altitude:
          type: number
          nullable: true
        altitude_accuracy:
          type: number
          nullable: true
        battery:
          type: integer
          nullable: true
          description: Battery percentage (1-100)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - device_id
        - latitude
        - longitude
        - created_at

    # Reusable request bodies for locations
    LocationCreate:
      type: object
      description: Payload to create a new location for a device
      required:
        - device_id
        - latitude
        - longitude
      properties:
        device_id:
          type: string
          description: Device ID this location belongs to
          example: "123"
        latitude:
          type: number
          format: float
          example: 51.5074
        longitude:
          type: number
          format: float
          example: -0.1278
        accuracy:
          type: number
          nullable: true
          description: Accuracy in meters
        altitude:
          type: number
          nullable: true
          description: Altitude in meters
        altitude_accuracy:
          type: number
          nullable: true
        battery:
          type: integer
          nullable: true
          description: Battery percentage (1-100)
      example:
        device_id: "123"
        latitude: 51.5074
        longitude: -0.1278
        accuracy: 5.2
        altitude: 15.0
        altitude_accuracy: 1.0
        battery: 78

    LocationUpdate:
      type: object
      description: Payload to update an existing location
      required:
        - id
      properties:
        id:
          type: string
          description: Location ID to update
          example: "456"
        device_id:
          type: string
          description: Device ID this location belongs to (optional)
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        accuracy:
          type: number
          nullable: true
        altitude:
          type: number
          nullable: true
        altitude_accuracy:
          type: number
          nullable: true
        battery:
          type: integer
          nullable: true
      example:
        id: "123"
        device_id: "456"
        latitude: 51.5074
        longitude: -0.1278
        accuracy: 5.2
        altitude: 15.0
        altitude_accuracy: 1.0
        battery: 78

    DeviceWithExtras:
      allOf:
        - $ref: "#/components/schemas/DeviceSafe"
        - type: object
          properties:
            latest_location:
              $ref: "#/components/schemas/LocationSafe"
              nullable: true
            is_connected:
              type: boolean
          required:
            - is_connected

  responses:
    Unauthorized:
      description: Access token missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
